name: native-ckc-capture

on:
  push:
    branches: [codex/native-ckc-capture]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lite:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build unzip git aria2
      - name: Download Android NDK r23b
        run: |
          aria2c -x 8 -s 8 -o android-ndk-r23b-linux.zip https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip -q android-ndk-r23b-linux.zip
      - name: Build diagnostic wrapper
        run: |
          cmake -S . -B build-native-ckc -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_HOST_LAUNCHERS=OFF
          cmake --build build-native-ckc --target lite -j2
          mkdir -p dist-native-ckc
          cp rootfs/system/bin/lite dist-native-ckc/lite
          sha256sum dist-native-ckc/lite > dist-native-ckc/SHA256SUMS
          git rev-parse HEAD > dist-native-ckc/source-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: lite-native-ckc-x86_64
          path: dist-native-ckc/
          retention-days: 7
